<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오톡 공유 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-share {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-share:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .info {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 카카오톡 공유 테스트</h1>
        
        <div class="info">
            💡 템플릿 도구에서 생성한 템플릿 ID와 JavaScript 키를 입력하고 테스트하세요.
        </div>

        <div class="form-group">
            <label for="jsKey">JavaScript 키 *</label>
            <input 
                type="text" 
                id="jsKey" 
                placeholder="예: abc1234def5678" 
                required
            >
        </div>

        <div class="form-group">
            <label for="templateId">템플릿 ID *</label>
            <input 
                type="text" 
                id="templateId" 
                placeholder="예: 12345" 
                required
            >
        </div>

        <div class="button-group">
            <button class="btn-share" onclick="shareToKakao()">
                카카오톡으로 공유
            </button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <!-- 카카오 SDK -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js"></script>
    
    <script>
        function shareToKakao() {
            const jsKey = document.getElementById('jsKey').value;
            const templateId = document.getElementById('templateId').value;
            const messageDiv = document.getElementById('message');

            // 유효성 검사
            if (!jsKey || !templateId) {
                showMessage('JavaScript 키와 템플릿 ID를 모두 입력해주세요.', 'error');
                return;
            }

            try {
                // SDK 초기화
                Kakao.init(jsKey);

                // SDK 초기화 확인
                if (!Kakao.isInitialized()) {
                    showMessage('카카오 SDK 초기화 실패. JavaScript 키를 확인하세요.', 'error');
                    return;
                }

                // 공유
                Kakao.Share.sendCustom({
                    templateId: parseInt(templateId),
                    templateArgs: {
                        // 필요한 경우 여기에 동적 데이터 추가
                        // 예: "groom": "김동우", "bride": "신소연"
                    }
                });

                showMessage('✅ 카카오톡으로 공유되었습니다!', 'success');
            } catch (error) {
                console.error('공유 실패:', error);
                showMessage(`❌ 공유 실패: ${error.message}`, 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            
            // 3초 후 메시지 사라지기
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 3000);
        }

        // Enter 키로도 공유 가능
        document.getElementById('templateId').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') shareToKakao();
        });
    </script>
</body>
</html>
